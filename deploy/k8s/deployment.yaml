apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-rag-api
  namespace: adaptive-rag
  labels:
    app.kubernetes.io/name: adaptive-rag-api
    app.kubernetes.io/part-of: adaptive-rag
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: adaptive-rag-api
  template:
    metadata:
      labels:
        app: adaptive-rag-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: adaptive-rag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: adaptive-rag-config
            - secretRef:
                name: adaptive-rag-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: adaptive-rag-api
  namespace: adaptive-rag
  labels:
    app.kubernetes.io/name: adaptive-rag-api
spec:
  type: ClusterIP
  selector:
    app: adaptive-rag-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
